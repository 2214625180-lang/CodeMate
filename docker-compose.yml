      CODEMATE_RBAC_VIEWER_USERS: ${CODEMATE_RBAC_VIEWER_USERS:-}
      CODEMATE_RBAC_VIEWER_TEAMS: ${CODEMATE_RBAC_VIEWER_TEAMS:-}
      CODEMATE_RBAC_VIEWER_ORGS: ${CODEMATE_RBAC_VIEWER_ORGS:-}
    ports:
      - "3000:3000"
    volumes:
      - ./artifacts:/app/artifacts
    depends_on:
      - backend

volumes:
  postgres_data:
  qdrant_data:
