services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codemate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codemate}
      POSTGRES_DB: ${POSTGRES_DB:-codemate}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.9.5
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  migrate:
    build:
      context: ./backend
    command: ["python", "-m", "app.core.migrations", "upgrade"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-codemate}:${POSTGRES_PASSWORD:-codemate}@postgres:5432/${POSTGRES_DB:-codemate}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-codemate}:${POSTGRES_PASSWORD:-codemate}@postgres:5432/${POSTGRES_DB:-codemate}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: codemate_chunks
      FRONTEND_URL: http://localhost:3000
      API_CORS_ORIGINS: http://localhost:3000
      EVALUATION_ADMIN_TOKEN: ${EVALUATION_ADMIN_TOKEN:-}
      EVALUATION_CI_TOKEN: ${EVALUATION_CI_TOKEN:-}
      EVALUATION_READ_TOKEN: ${EVALUATION_READ_TOKEN:-}
      CODEMATE_PROXY_IDENTITY_SECRET: ${CODEMATE_PROXY_IDENTITY_SECRET:-}
      CODEMATE_PROXY_IDENTITY_PREVIOUS_SECRET: ${CODEMATE_PROXY_IDENTITY_PREVIOUS_SECRET:-}
      CODEMATE_PROXY_IDENTITY_TTL_SECONDS: ${CODEMATE_PROXY_IDENTITY_TTL_SECONDS:-300}
      CODEMATE_PROXY_IDENTITY_NONCE_STORE: ${CODEMATE_PROXY_IDENTITY_NONCE_STORE:-redis}
      CODEMATE_REQUIRE_SIGNED_BROWSER_IDENTITY: ${CODEMATE_REQUIRE_SIGNED_BROWSER_IDENTITY:-false}
      SECURITY_AUDIT_LOG_PATH: ${SECURITY_AUDIT_LOG_PATH:-/app/artifacts/security/events.jsonl}
      SECURITY_AUDIT_EXPORT_REQUIRED: ${SECURITY_AUDIT_EXPORT_REQUIRED:-false}
      SECURITY_AUDIT_FAIL_CLOSED: ${SECURITY_AUDIT_FAIL_CLOSED:-false}
      SECURITY_AUDIT_INGEST_TOKEN: ${SECURITY_AUDIT_INGEST_TOKEN:-}
      SECURITY_AUDIT_SINKS: ${SECURITY_AUDIT_SINKS:-}
      SECURITY_AUDIT_SIEM_URL: ${SECURITY_AUDIT_SIEM_URL:-}
      SECURITY_AUDIT_SIEM_HMAC_SECRET: ${SECURITY_AUDIT_SIEM_HMAC_SECRET:-}
      SECURITY_AUDIT_S3_BUCKET: ${SECURITY_AUDIT_S3_BUCKET:-}
      SECURITY_AUDIT_S3_PREFIX: ${SECURITY_AUDIT_S3_PREFIX:-codemate/security-audit}
      SECURITY_AUDIT_S3_RETENTION_DAYS: ${SECURITY_AUDIT_S3_RETENTION_DAYS:-365}
