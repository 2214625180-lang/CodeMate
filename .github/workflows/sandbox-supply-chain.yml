name: Sandbox Supply Chain

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - deploy/execution-plane/**
      - .github/workflows/sandbox-supply-chain.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/codemate-backend
  EXECUTION_IMAGE: ghcr.io/${{ github.repository_owner }}/codemate-execution-plane

jobs:
  build-sign-attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend with SLSA-compatible provenance
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Sign backend image by immutable digest
        run: cosign sign --yes "${BACKEND_IMAGE}@${{ steps.backend.outputs.digest }}"
      - name: Build execution plane with provenance
        id: execution
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/execution-plane/Dockerfile
          push: true
          tags: ${{ env.EXECUTION_IMAGE }}:${{ github.sha }}
          build-args: CODEMATE_BACKEND_IMAGE=${{ env.BACKEND_IMAGE }}@${{ steps.backend.outputs.digest }}
          provenance: mode=max
          sbom: true
      - name: Sign execution-plane image by immutable digest
        run: cosign sign --yes "${EXECUTION_IMAGE}@${{ steps.execution.outputs.digest }}"
      - name: Emit immutable release references
        run: |
          echo "${BACKEND_IMAGE}@${{ steps.backend.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          echo "${EXECUTION_IMAGE}@${{ steps.execution.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
