name: Evaluation Gate

on:
  pull_request:
    paths:
      - "backend/app/agent/**"
      - "backend/app/services/evaluation_service.py"
      - "backend/app/services/retrieval_service.py"
      - "benchmarks/**"
      - "scripts/benchmark_suite.py"
      - "scripts/run_benchmark_matrix.py"
      - ".github/workflows/evaluation-gate.yml"
  workflow_dispatch:
    inputs:
      dataset_id:
        description: Fixed benchmark dataset id registered by scripts/bootstrap_benchmark.py
        required: true
        default: "aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa"
      run_name:
        description: Optional candidate evaluation run name
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark-contract:
    name: Validate fixtures and datasets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify fixed commits, 30 retrieval cases, 20 fix cases, and controls
        run: python scripts/benchmark_suite.py > benchmark-validation.json

      - name: Upload benchmark validation
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-validation
          path: benchmark-validation.json

  evaluation-gate:
    name: Run real remote evaluation gate
    needs: benchmark-contract
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CODEMATE_API_BASE_URL != '' }}
    runs-on: ubuntu-latest
    env:
      CODEMATE_API_BASE_URL: ${{ vars.CODEMATE_API_BASE_URL }}
      CODEMATE_EVAL_DATASET_ID: ${{ inputs.dataset_id || vars.CODEMATE_EVAL_DATASET_ID }}
      CODEMATE_EVALUATION_API_TOKEN: ${{ secrets.CODEMATE_EVALUATION_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate remote configuration
        run: |
          test -n "$CODEMATE_API_BASE_URL" || { echo "CODEMATE_API_BASE_URL is required"; exit 2; }
          test -n "$CODEMATE_EVAL_DATASET_ID" || { echo "CODEMATE_EVAL_DATASET_ID is required"; exit 2; }
          test -n "$CODEMATE_EVALUATION_API_TOKEN" || { echo "CODEMATE_EVALUATION_API_TOKEN is required"; exit 2; }

      - name: Run candidate evaluation and regression gate
        run: |
          RUN_NAME="${{ inputs.run_name }}"
          if [ -z "$RUN_NAME" ]; then
            RUN_NAME="ci-${GITHUB_SHA}"
          fi
          python scripts/run_dataset_eval_gate.py \
            --base-url "$CODEMATE_API_BASE_URL" \
            --dataset-id "$CODEMATE_EVAL_DATASET_ID" \
            --name "$RUN_NAME" \
            --artifact-dir artifacts/evaluations \
            --snapshot-backfill-audit

      - name: Comment evaluation summary on PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          SUMMARY_FILE="$(find artifacts/evaluations -name '*-gate-summary.md' -print -quit)"
          if [ -n "$SUMMARY_FILE" ]; then
            python scripts/upsert_pr_comment.py \
              --repo "${{ github.repository }}" \
              --pr-number "${{ github.event.pull_request.number }}" \
              --body-file "$SUMMARY_FILE"
          fi

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-artifacts
          path: artifacts/evaluations
          if-no-files-found: error
