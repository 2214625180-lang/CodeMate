name: Production Readiness

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install --upgrade pip && pip install -r backend/requirements-dev.txt
      - run: ruff check backend/app backend/tests
      - run: ruff check scripts/run_sandbox_ha_qualification.py scripts/sandbox_execution_probe.py
      - run: python -m compileall -q backend/app
      - run: pytest backend/tests -q
        env:
          DATABASE_MIGRATIONS_ENABLED: "false"
      - name: Enforce Agent-core branch coverage
        run: >-
          pytest backend/tests/test_agent_*.py -q
          --cov=backend/app/agent
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=65
      - run: pip-audit --local --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm audit --audit-level=high --registry=https://registry.npmjs.org

  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --registry=https://registry.npmjs.org --replace-registry-host=always
      - run: npx playwright install --with-deps chromium
      - name: Run open-mode golden path
        run: npm run test:e2e
      - name: Run protected-mode user isolation
        run: npm run test:e2e:protected

  real-infrastructure:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: codemate
          POSTGRES_PASSWORD: codemate
          POSTGRES_DB: codemate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codemate -d codemate"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://codemate:codemate@127.0.0.1:5432/codemate
      REDIS_URL: redis://127.0.0.1:6379/0
      RUN_MCP_E2E: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Verify migration upgrade, downgrade and drift
        working-directory: backend
        run: |
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini check
          alembic -c alembic.ini downgrade base
          alembic -c alembic.ini upgrade head
      - name: Start real HTTP MCP and OAuth fixtures
        working-directory: backend
        run: |
          python -m tests.integration.mock_mcp_server > /tmp/mock-mcp.log 2>&1 &
          python -m tests.integration.mock_identity_provider > /tmp/mock-idp.log 2>&1 &
          for i in {1..30}; do
            nc -z 127.0.0.1 8765 && curl -fsS http://127.0.0.1:8766/docs >/dev/null && break
            sleep 1
          done
          nc -z 127.0.0.1 8765
          curl -fsS http://127.0.0.1:8766/docs >/dev/null
      - name: Run production-stack evidence test
        run: pytest backend/tests/integration/test_production_stack.py -q
      - name: Upload fixture logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-infrastructure-logs
          path: /tmp/mock-*.log

  container-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - name: Validate staging Compose template
        run: |
          docker compose --env-file deploy/staging/.env.staging.example \
            -f deploy/staging/docker-compose.yml config --quiet
      - name: Enforce MCP sandbox container policy
        run: |
          python scripts/mcp_container_compliance.py \
            --env-file deploy/staging/.env.staging.example \
            --compose-file deploy/staging/docker-compose.yml
      - run: docker compose build backend worker migrate frontend
      - run: |
          docker compose --env-file deploy/staging/.env.staging.example \
            -f deploy/staging/docker-compose.yml build mcp-sandbox mcp-egress
