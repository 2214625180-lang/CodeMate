apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: sandbox-execution-plane-mtls
  namespace: codemate-sandbox
spec:
  secretName: sandbox-execution-plane-mtls
  duration: 24h
  renewBefore: 8h
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  dnsNames:
    - sandbox-execution-plane
    - sandbox-execution-plane.codemate-sandbox
    - sandbox-execution-plane.codemate-sandbox.svc
  ipAddresses: [127.0.0.1]
  usages: [server auth, client auth]
  issuerRef:
    name: codemate-workload-ca
    kind: ClusterIssuer
    group: cert-manager.io
